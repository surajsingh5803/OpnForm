# LP Forms staging Blueprint (Neon PostgreSQL supplied separately).
# This file only describes infrastructure; a Blueprint plan requires explicit approval to deploy.
# Paid resources are deliberately visible in the Render plan before approval.
services:
  - type: keyvalue
    name: lp-forms-cache
    plan: 256mb
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: pserv
    name: lp-forms-api
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    autoDeployTrigger: off
    dockerContext: .
    dockerfilePath: deploy/render/Dockerfile.api
    dockerCommand: /usr/local/bin/serve-lp-forms-api
    healthCheckPath: /healthz
    envVars:
      - key: APP_NAME
        value: LP Forms
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: FRONT_API_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: CACHE_STORE
        value: redis
      - key: CACHE_DRIVER
        value: redis
      - key: SESSION_DRIVER
        value: redis
      # Staging: jobs execute synchronously until a dedicated worker is deployed.
      - key: QUEUE_CONNECTION
        value: sync
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lp-forms-cache
          property: connectionString
      - key: REDIS_STATE_URL
        fromService:
          type: keyvalue
          name: lp-forms-cache
          property: connectionString
      - key: REDIS_AUTH_URL
        fromService:
          type: keyvalue
          name: lp-forms-cache
          property: connectionString
      - key: REDIS_CACHE_URL
        fromService:
          type: keyvalue
          name: lp-forms-cache
          property: connectionString
      # Staging defaults: no real emails and ephemeral uploads, not production-safe.
      - key: MAIL_MAILER
        value: log
      - key: FILESYSTEM_DRIVER
        value: local
      - key: JWT_SKIP_IP_UA_VALIDATION
        value: "false"
      - key: MCP_ENABLED
        value: "false"
      - key: PORT
        value: "10000"

  - type: web
    name: lp-forms-web
    runtime: docker
    plan: 1c-2g
    region: oregon
    autoDeployTrigger: off
    dockerContext: .
    dockerfilePath: deploy/render/Dockerfile.client
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: NITRO_PORT
        value: "10000"
      - key: NITRO_HOST
        value: 0.0.0.0
      - key: NUXT_PUBLIC_ENV
        value: production
      - key: NUXT_PUBLIC_APP_URL
        value: /
      - key: NUXT_PUBLIC_API_BASE
        value: /api
      - key: NUXT_PUBLIC_SELF_HOSTED_NAME
        value: LP Forms
      - key: NUXT_API_SECRET
        fromService:
          type: pserv
          name: lp-forms-api
          envVarKey: FRONT_API_SECRET
      - key: LP_FORMS_API_HOSTPORT
        fromService:
          type: pserv
          name: lp-forms-api
          property: hostport
